monorepo_root = true

[settings]
status.missing_tools = "always"
sops.rops = false

[monorepo]
config_roots = ["apps/*", "packages/*"]

[env]
_.file = [".env", ".env.development.yaml", ".env.local"]
_.path = ["./node_modules/.bin", "./bin"]

[tools]
node = "24.18.0"
shellcheck = "0.10.0"
sops = "3.10.2"
age = "1.2.1"
jq = "1.8.0"
rust = "stable"
neonctl = "2.27.0"
vercel = "58.4.4"
java = "temurin-21.0.12+8.0.LTS"
android-sdk = "22.0"
watchexec = "2.5.1"

[tasks.lint]
depends = [
    "eslint",
    "prettier",
    "check-package-lock",
    "shellcheck",
    "tsc",
    "prisma:validate",
    # TODO: unfortunately whenever there's patches for the current major version of expo, this starts erroring
    # "//apps/mobile:expo:doctor",
]
[tasks.prettier]
run = "prettier --check --log-level warn ."
[tasks.eslint]
run = "eslint --concurrency auto"
[tasks.check-package-lock]
run = "check-package-lock"
[tasks.shellcheck]
run = "shellcheck-all"
[tasks.tsc]
run = "tsc -b"
[tasks.'prisma:validate']
run = "prisma validate --schema packages/backend/prisma/schema.prisma"
silent = true

[tasks.'lint:fix']
depends = ["prettier:fix", "eslint:fix"]
[tasks.'prettier:fix']
run = "prettier --write --log-level warn ."
wait_for = ["eslint:fix"]
[tasks.'eslint:fix']
run = "eslint --concurrency auto --fix"

[tasks.dev]
depends = ["//...:dev"]

[tasks.build]
depends = ["//...:build"]
